# fly.toml app configuration file generated for ahorrito on 2026-09-07T19:47:04-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ahorrito'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  COOKIE_SAMESITE = 'lax'
  COOKIE_SECURE = 'true'
  CORS_ORIGINS = '[]'
  DATABASE_URL = 'sqlite+aiosqlite:////data/compras.db'
  REGISTRATION_OPEN = 'false'
  STATIC_DIR = '/app/static'

  # Las tres URLs de retorno del account linking de Alexa. NO son credenciales
  # —son URLs de Amazon que sólo llevan el vendor ID— y van acá y no en
  # `fly secrets` justamente para que se puedan leer: cuando el vínculo falla,
  # lo primero que hay que hacer es comparar esto, carácter por carácter, contra
  # el `redirect_uri` que Alexa mandó y que quedó en los logs. Como secret son un
  # digest opaco, y este archivo estuvo caído medio día por no poder mirar uno.
  #
  # Descomentar reemplazando TU_VENDOR_ID por el de la consola de Amazon
  # (Account Linking → Alexa Redirect URLs) y después, en el mismo orden:
  #     fly secrets unset ALEXA_LINK_REDIRECT_URIS -a ahorrito
  # El unset va DESPUÉS: un secret con este nombre pisa lo que diga acá, así que
  # mientras exista, esta línea no tiene ningún efecto.
  #
  # ALEXA_LINK_REDIRECT_URIS = '["https://layla.amazon.com/api/skill/link/TU_VENDOR_ID","https://pitangui.amazon.com/api/skill/link/TU_VENDOR_ID","https://alexa.amazon.co.jp/api/skill/link/TU_VENDOR_ID"]'

[[mounts]]
  source = 'compras_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  # `fly launch` regeneró este archivo desde la web y se llevó puesta esta
  # línea. Sin ella, Fly puede escalar a una segunda máquina bajo carga, y eso
  # rompe dos cosas a la vez: SQLite en el volumen no admite dos procesos
  # escribiendo, y el rate limiter hacia los supermercados vive en memoria de
  # cada proceso —con dos máquinas, cada una cuenta por su lado y el techo real
  # se duplica—.

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
