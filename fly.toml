# fly.toml app configuration file generated for ahorrito on 2026-09-07T19:47:04-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ahorrito'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  COOKIE_SAMESITE = 'lax'
  COOKIE_SECURE = 'true'
  CORS_ORIGINS = '[]'
  DATABASE_URL = 'sqlite+aiosqlite:////data/compras.db'
  REGISTRATION_OPEN = 'false'
  STATIC_DIR = '/app/static'


[[mounts]]
  source = 'compras_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  # `fly launch` regeneró este archivo desde la web y se llevó puesta esta
  # línea. Sin ella, Fly puede escalar a una segunda máquina bajo carga, y eso
  # rompe dos cosas a la vez: SQLite en el volumen no admite dos procesos
  # escribiendo, y el rate limiter hacia los supermercados vive en memoria de
  # cada proceso —con dos máquinas, cada una cuenta por su lado y el techo real
  # se duplica—.

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
