<!doctype html>
<!--
  El login que ve el usuario cuando vincula el skill desde la app de Alexa.

  Se abre dentro del navegador embebido de la app de Alexa, que es un contexto
  distinto del navegador donde usa Ahorrito: **acá no hay cookie de sesión**, y
  por eso hay que pedir email y contraseña aunque del otro lado esté logueado.

  HTML entero y sin JavaScript, igual que `privacy.html`: los webviews embebidos
  son el peor lugar para depender de un bundle, y un formulario que postea es lo
  único que anda seguro en todos.

  Los `{{...}}` los reemplaza `oauth_alexa.py` escapando el contenido. No es un
  motor de plantillas: son cuatro `str.replace` sobre valores que ya se
  validaron contra la whitelist antes de llegar acá.
-->
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vincular con Alexa · Ahorrito</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f2f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f" />

  <style>
    :root {
      --bg: #f1f2f7;
      --surface: #ffffff;
      --border: #e3e4ee;
      --text: #14151f;
      --text-2: #5a5c72;
      --text-3: #8b8da3;
      --accent: #0e8f7e;
      --accent-strong: #0a6d61;
      --accent-tint: #e2f4f1;
      --danger: #c0392b;
      --danger-tint: #fdecea;
      --shadow: 0 1px 2px rgb(20 21 32 / 0.04), 0 12px 32px -12px rgb(20 21 32 / 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0d0f;
        --surface: #16181c;
        --border: #262a31;
        --text: #eceef2;
        --text-2: #a7abb6;
        --text-3: #767c8a;
        --accent: #2fb9a4;
        --accent-strong: #4fd0bb;
        --accent-tint: #12312d;
        --danger: #ef6f61;
        --danger-tint: #2b1614;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* 16px y no menos: en iOS un input con fuente más chica hace que Safari
         haga zoom al enfocarlo, y adentro del webview de Alexa eso deja el
         formulario cortado a la mitad sin forma de volver. */
    }

    main {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--text-2);
      font-size: 0.9rem;
    }

    .error {
      margin: 0 0 18px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-tint);
      color: var(--danger);
      font-size: 0.875rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
    }

    input {
      width: 100%;
      margin-bottom: 16px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }

    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-strong); }

    button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .note {
      margin: 20px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--text-3);
      font-size: 0.8rem;
    }

    .note a { color: var(--text-2); }
  </style>
</head>

<body>
  <main>
    <h1>Vincular con Alexa</h1>
    <p class="sub">Entrá con tu cuenta de Ahorrito para que Alexa pueda anotar en tu lista.</p>

    {{ERROR}}

    <form method="post" action="/oauth/alexa/authorize" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username"
             required autofocus />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required />

      <!--
        El estado del flujo OAuth viaja en el formulario y no en una cookie: en
        un webview embebido no hay garantía de que la cookie sobreviva el salto,
        y si se pierde el `state` Amazon rechaza la vuelta sin explicar por qué.
        Se vuelven a validar del lado del server: que hayan salido de acá no
        significa que vuelvan intactos.
      -->
      <input type="hidden" name="client_id" value="{{CLIENT_ID}}" />
      <input type="hidden" name="redirect_uri" value="{{REDIRECT_URI}}" />
      <input type="hidden" name="state" value="{{STATE}}" />
      <input type="hidden" name="code_challenge" value="{{CODE_CHALLENGE}}" />
      <input type="hidden" name="code_challenge_method" value="{{CODE_CHALLENGE_METHOD}}" />

      <button type="submit">Vincular</button>
    </form>

    <p class="note">
      Alexa va a poder agregar y leer productos de tu lista. No accede a tus
      domicilios, tus medios de pago ni tu historial de precios.
      <a href="/privacidad">Política de privacidad</a>.
    </p>
  </main>
</body>

</html>
