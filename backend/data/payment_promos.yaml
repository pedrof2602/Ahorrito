- id: modo-disco-finde
  name: "MODO 20% en Disco los fines de semana"
  issuer_slug: modo
  percent: 20
  weekdays: [vie, sab, dom]
  rails: [modo]
  card_kinds: [credit, debit]
  chain_slugs: [disco-ar]
  cap_cents: 2500000        # $25.000 por banco por mes
  cap_period: monthly
  benefit_type: reintegro
  channels: [in_store]
  stacks_with_provider_promos: false
  valid_from: 2026-01-01
  valid_to: 2026-12-31
  verified_on: 2026-09-01
  source_url: "https://www.iproup.com/economia-digital/65293-descuentos-en-supermercados-con-modo-y-mercado-pago-como-ahorrar-en-coto-dia-y-carrefour"
  unverified: true
  notes: >-
    **Fuente secundaria (prensa), no la página de MODO.** Es la única promo
    curada que le pone un número a Disco, que es justo la cadena sin checkout
    consultable: acá todo el ahorro sale de esta regla y nada está medido.
    Verificar contra modo.com.ar antes de usarla para decidir. El tope declarado
    es "por banco por mes", un matiz que el modelo no distingue: si se paga con
    tarjetas de dos bancos, el tope real es más alto que el que calculamos.
    Además la promo es del riel, no del emisor: aplica con la tarjeta de
    cualquier banco mientras se pague por QR MODO. Como `matches()` exige que el
    `issuer_slug` coincida, para que esta regla se dispare hay que tener cargado
    un medio de pago con `issuer_slug: modo`.

