# Emisores y sus BIN conocidos.
#
# El BIN son los primeros 6 a 8 dígitos de la tarjeta e identifican al emisor,
# no a la persona. Es lo único que la simulación de VTEX necesita para decidir si
# una promo aplica.
#
# ────────────────────────────────────────────────────────────────────────────
# ACÁ SOLO VAN BIN MEDIDOS.
#
# Un BIN equivocado no falla: devuelve el precio de góndola como si esa tarjeta
# no tuviera beneficio, o —peor— activa la promo de otra tarjeta. En los dos
# casos el usuario ve un número creíble y falso.
#
# Para agregar un emisor: cargá la tarjeta con `bin_source: user` y corré
#   POST /api/v1/payment-instruments/{id}/verify
# que prueba el BIN contra el checkout real y contesta qué promos desbloquea.
# Si activa algo, pasa a `verified` y recién ahí conviene traerlo a este archivo.
# ────────────────────────────────────────────────────────────────────────────

- issuer_slug: carrefour-banco
  display_name: Carrefour Banco
