  # "Tarjeta Carrefour 15%" y los 9 activan el descuento en la simulación.
  # Ojo: hay que mandar `paymentSystem` junto al BIN o no aplica nada.
  bins:
    - "507858"
    - "858110"
    - "858111"
    - "585274"
    - "538156"
    - "520225"
    - "539958"
    - "527061"
    - "898989"
  verified_on: 2026-08-31
  notes: >-
    Tarjeta Carrefour Mastercard. Activa "Tarjeta Carrefour 15%".

