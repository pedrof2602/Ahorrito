# Deploy continuo a Fly.io.
#
# Fly no tiene integración nativa con GitHub como Vercel: el equivalente es este
# workflow, que es lo que la documentación de Fly recomienda. Cada push a `main`
# publica.
#
# Antes del primer push hace falta, una sola vez:
#   1. fly launch --no-deploy         (completa `app` en fly.toml)
#   2. fly tokens create deploy -x 999999h
#   3. pegar ese token en el repo: Settings -> Secrets and variables ->
#      Actions -> New repository secret, con nombre FLY_API_TOKEN
#
# En un repo público esto es seguro: los secrets no se exponen a los workflows
# que dispara un fork, y este solo corre en push a `main` del repo original.

name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest

    # Dos deploys pisándose dejan la app en un estado indefinido, y con un
    # volumen de por medio es peor. `concurrency` los serializa.
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # `--remote-only` construye la imagen en los builders de Fly, así que este
      # runner no necesita Docker ni levantar el build del frontend.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
